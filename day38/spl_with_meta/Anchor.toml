[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
spl_with_meta = "AnLGBowxWXerdTqWbE9cMtadDsHfou6gNyKuUuTZaSeN"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# 进阶：按集群单独配置（多环境复用 API Key）
[provider.clusters]
devnet = { rpc_url = "https://devnet.helius-rpc.com/?api-key=$HELIUS_API_KEY" }
testnet = { rpc_url = "https://testnet.helius-rpc.com/?api-key=$HELIUS_API_KEY" }
mainnet-beta = { rpc_url = "https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY" }
localnet = { rpc_url = "http://127.0.0.1:8899" }

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
